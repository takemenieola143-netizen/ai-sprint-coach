<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7.1 Review</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script><style>body{font:16px system-ui;background:#101827;color:#eee;max-width:650px;margin:auto;padding:16px}button,input,select{font:inherit;padding:12px;margin:5px;border-radius:9px;max-width:95%}button{background:#dcecff;color:#13233a}button:disabled{opacity:.45}canvas{width:100%;height:auto;max-height:55vh;object-fit:contain;background:#000;touch-action:none}video{display:none}p{line-height:1.4}</style></head><body><h1>V7.1 · Skeleton review</h1><p>Choose a clip. Review four automatically selected frames. Green dots are AI predictions, cyan dots are your corrections. Skip unclear joints.</p><input id="file" type="file" accept="video/*"><button id="start">Start clip</button><video id="v" muted playsinline preload="auto"></video><p id="status">Choose a video</p><canvas id="c"></canvas><div><button id="accept" disabled>Accept joint</button><button id="correct" disabled>Correct joint</button><button id="skip" disabled>Skip joint</button><button id="all" disabled>Accept visible frame</button><button id="next" disabled>Next frame</button></div><button id="zoom" disabled>Zoom / full view</button><button id="export">Export review JSON</button><p id="progress"></p><script>
const $=s=>document.getElementById(s),v=$('v'),c=$('c'),ctx=c.getContext('2d'),ids=[23,25,27,29,31,24,26,28,30,32],names=['Left hip','Left knee','Left ankle','Left heel','Left toe','Right hip','Right knee','Right ankle','Right heel','Right toe'];let pose,frame,raw,points=[],reviews=[],records=[],times=[],i=0,j=0,box,full,zoomed=true,correcting=false,ready=false,url,clip;const msg=s=>$('status').textContent=s;function wait(event,action){return new Promise((resolve,reject)=>{let t;function end(e){clearTimeout(t);v.removeEventListener(event,ok);v.removeEventListener('error',bad);e?reject(e):resolve()}function ok(){end()}function bad(){end(Error(event+' failed'))}v.addEventListener(event,ok);v.addEventListener('error',bad);t=setTimeout(bad,15000);action()})}function timeout(p,ms){let t;return Promise.race([p,new Promise((_,r)=>t=setTimeout(()=>r(Error('Model timed out; reload and retry on Wi-Fi')),ms))]).finally(()=>clearTimeout(t))}async function infer(){if(!pose){pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/'+f});pose.setOptions({modelComplexity:1,staticImageMode:true,smoothLandmarks:false,minDetectionConfidence:.5})}let result=null;pose.onResults(r=>result=r.poseLandmarks||null);await timeout(pose.send({image:frame}),45000);return result}function region(){let p=raw?.filter(q=>q.visibility>=.5&&q.x>=0&&q.x<=1&&q.y>=0&&q.y<=1)||[];if(p.length<3)return full;let xs=p.map(q=>q.x*full.w),ys=p.map(q=>q.y*full.h),l=Math.min(...xs),r=Math.max(...xs),t=Math.min(...ys),b=Math.max(...ys),pad=Math.max(12,(b-t)*.25),w=Math.min(full.w,Math.max(r-l+2*pad,full.w*.18)),h=Math.min(full.h,Math.max(b-t+2*pad,full.h*.18));return {x:Math.max(0,Math.min(full.w-w,(l+r-w)/2)),y:Math.max(0,Math.min(full.h-h,(t+b-h)/2)),w,h}}function draw(){box=zoomed?region():full;c.width=Math.round(box.w);c.height=Math.round(box.h);ctx.drawImage(frame,box.x,box.y,box.w,box.h,0,0,c.width,c.height);const xy=p=>[(p.x*full.w-box.x)*c.width/box.w,(p.y*full.h-box.y)*c.height/box.h];const valid=p=>p&&p.visibility>=.7;ctx.lineWidth=Math.max(1,c.width/180);ctx.strokeStyle='#43ef91';for(const [a,b] of [[0,1],[1,2],[2,3],[2,4],[5,6],[6,7],[7,8],[7,9],[0,5]])if(valid(points[a])&&valid(points[b])){ctx.beginPath();ctx.moveTo(...xy(points[a]));ctx.lineTo(...xy(points[b]));ctx.stroke()}points.forEach((p,k)=>{if(!valid(p))return;ctx.fillStyle=k===j?'#ffb32c':'#43ef91';ctx.beginPath();ctx.arc(...xy(p),Math.max(2,c.width/85),0,Math.PI*2);ctx.fill()});reviews.forEach(r=>{if(r.manual){ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(...xy(r.manual),Math.max(2,c.width/85),0,Math.PI*2);ctx.fill()}})}function update(){draw();let done=j>=10;for(let k of ['correct','skip','all'])$(k).disabled=!ready||done;$('accept').disabled=!ready||done||!(points[j]?.visibility>=.7);$('next').disabled=!ready||!done;$('zoom').disabled=!ready;msg(done?'Frame reviewed. Tap Next frame.':`Frame ${i+1}/4 · ${names[j]} (${j+1}/10)${correcting?' — tap correct position':''}`);$('progress').textContent=`Saved frames: ${records.length}`;}function mark(action,manual=null){if(!ready||j>=10)return;let ai=points[j];reviews.push({joint:names[j],action,ai,manual,errorPx:manual&&ai?Math.hypot((manual.x-ai.x)*full.w,(manual.y-ai.y)*full.h):null});j++;correcting=false;update()}async function load(){ready=false;for(let k of ['accept','correct','skip','all','next','zoom'])$(k).disabled=true;msg('Loading frame and AI model…');let t=times[i];if(Math.abs(v.currentTime-t)>.001)await wait('seeked',()=>v.currentTime=t);frame=document.createElement('canvas');frame.width=v.videoWidth;frame.height=v.videoHeight;frame.getContext('2d').drawImage(v,0,0);full={x:0,y:0,w:frame.width,h:frame.height};raw=await infer();points=ids.map(k=>raw?.[k]||null);reviews=[];j=0;correcting=false;zoomed=true;ready=true;update()}$('start').onclick=async()=>{try{let f=$('file').files[0];if(!f)throw Error('Choose a video');$('start').disabled=true;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);clip=f.name;await wait('loadeddata',()=>{v.src=url;v.load()});times=[.15,.35,.65,.85].map(x=>x*Math.min(4,v.duration));i=0;await load()}catch(e){msg(e.message);$('start').disabled=false}};$('accept').onclick=()=>mark('accepted');$('skip').onclick=()=>mark('skipped');$('correct').onclick=()=>{correcting=true;update()};$('all').onclick=()=>{while(j<10)mark(points[j]?.visibility>=.7?'accepted_frame':'skipped')};$('zoom').onclick=()=>{zoomed=!zoomed;draw()};c.onclick=e=>{if(!ready||!correcting)return;let r=c.getBoundingClientRect(),s=Math.min(r.width/c.width,r.height/c.height),x=(e.clientX-r.left-(r.width-c.width*s)/2)/(c.width*s),y=(e.clientY-r.top-(r.height-c.height*s)/2)/(c.height*s);if(x>=0&&x<=1&&y>=0&&y<=1)mark('corrected',{x:(box.x+x*box.w)/full.w,y:(box.y+y*box.h)/full.h})};$('next').onclick=async()=>{if(!ready||j<10)return;records.push({clip,requestedSeconds:times[i],seekSeconds:v.currentTime,width:full.w,height:full.h,reviews});ready=false;try{if(++i<4)await load();else{msg('Complete — export review JSON');$('next').disabled=true;$('zoom').disabled=true;$('start').disabled=false;$('progress').textContent=`Saved frames: ${records.length}`}}catch(e){msg(e.message);$('start').disabled=false}};$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:'7.1',note:'AI-assisted review, not independent ground truth; accepted joints are not zero-error measurements.',records},null,2)],{type:'application/json'}));a.href=u;a.download='sprint-v7-1-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
</script></body></html>
