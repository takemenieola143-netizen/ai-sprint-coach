<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sprint V7</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script><style>body{font:16px system-ui;background:#101827;color:#eee;max-width:720px;margin:auto;padding:16px}button,input,select{font:inherit;margin:5px;padding:10px;border-radius:8px}button{background:#dcecff;color:#13233a}canvas{width:100%;max-height:65vh;object-fit:contain;touch-action:none;background:#000}p{line-height:1.5}video{display:none}pre{white-space:pre-wrap}</style></head><body><h1>V7 · Accuracy validation</h1><p>Choose one original clip. Mark visible joints on four frames before seeing AI predictions. Skip hidden joints. Crop recovery runs only if baseline torso detection is weak.</p><input id=f type=file accept="video/*"><button id=start>Start clip</button><video id=v playsinline muted preload=auto></video><p id=status>Ready</p><canvas id=c></canvas><div><button id=skip disabled>Skip hidden joint</button><button id=undo disabled>Undo</button><button id=confirm disabled>Analyze frame</button><button id=next disabled>Next frame</button></div><button id=export>Export validation JSON</button><pre id=result></pre><script>
const $=id=>document.getElementById(id),v=$('v'),c=$('c'),ctx=c.getContext('2d'), names=['leftHip','leftKnee','leftAnkle','leftHeel','leftToe','rightHip','rightKnee','rightAnkle','rightHeel','rightToe'],ids=[23,25,27,29,31,24,26,28,30,32];let records=[],marks=[],index=0,times=[],pose,url,frame,active=false,clip='',pred=null;const status=s=>$('status').textContent=s;function wait(el,event,action){return new Promise((resolve,reject)=>{let timer;const done=()=>{clearTimeout(timer);el.removeEventListener(event,done);el.removeEventListener('error',fail);resolve()},fail=()=>{clearTimeout(timer);el.removeEventListener(event,done);el.removeEventListener('error',fail);reject(Error(event+' failed'))};el.addEventListener(event,done,{once:true});el.addEventListener('error',fail,{once:true});timer=setTimeout(fail,15000);action()})}function draw(){ctx.drawImage(frame,0,0);for(let i=0;i<marks.length;i++){const p=marks[i];if(p)dot(p,'#00e5ff',i+1)}if(pred)pred.forEach((p,i)=>{if(p&&p.visibility>=.7)dot(p,'#ff9b42',i+1)})}function dot(p,color,n){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x*c.width,p.y*c.height,Math.max(3,c.width/150),0,7);ctx.fill();ctx.font='14px sans-serif';ctx.fillText(n,p.x*c.width+5,p.y*c.height-5)}function update(){draw();status(marks.length===names.length?'All joints marked. Analyze frame.':`Frame ${index+1}/${times.length}: tap anatomical ${names[marks.length]} (${marks.length+1}/10)`);$('confirm').disabled=marks.length!==names.length;$('skip').disabled=marks.length===names.length;$('undo').disabled=!marks.length}async function loadFrame(){active=false;pred=null;marks=[];let t=times[index];if(Math.abs(v.currentTime-t)>.001)await wait(v,'seeked',()=>v.currentTime=t);c.width=v.videoWidth;c.height=v.videoHeight;frame=document.createElement('canvas');frame.width=c.width;frame.height=c.height;frame.getContext('2d').drawImage(v,0,0);active=true;$('next').disabled=true;update()}$('start').onclick=async()=>{try{const f=$('f').files[0];if(!f)throw Error('Choose a video');$('start').disabled=true;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);clip=f.name;await wait(v,'loadeddata',()=>{v.src=url;v.load()});let end=Math.min(4,v.duration);times=[.15,.35,.65,.85].map(x=>x*end);index=0;await loadFrame()}catch(e){status(e.message);$('start').disabled=false}};c.onclick=e=>{if(!active||marks.length>=names.length)return;let r=c.getBoundingClientRect(),scale=Math.min(r.width/c.width,r.height/c.height),x=(e.clientX-r.left-(r.width-c.width*scale)/2)/(c.width*scale),y=(e.clientY-r.top-(r.height-c.height*scale)/2)/(c.height*scale);if(x>=0&&x<=1&&y>=0&&y<=1){marks.push({x,y});update()}};$('skip').onclick=()=>{if(active){marks.push(null);update()}};$('undo').onclick=()=>{if(active){marks.pop();update()}};async function infer(image){if(!pose){pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/'+f});pose.setOptions({modelComplexity:1,staticImageMode:true,smoothLandmarks:false,minDetectionConfidence:.5})}let result;pose.onResults(r=>result=r.poseLandmarks||null);await pose.send({image});return result||null}function evaluate(p){return names.map((joint,i)=>{let a=marks[i],b=p?.[ids[i]];return {joint,manual:a,ai:b||null,errorPx:a&&b&&b.visibility>=.7?Math.hypot((a.x-b.x)*c.width,(a.y-b.y)*c.height):null}})}$('confirm').onclick=async()=>{active=false;for(let id of ['skip','undo','confirm'])$(id).disabled=true;status('Running baseline…');try{let base=await infer(frame),crop=null,box=null;let visible=marks.filter(Boolean);if((!base||[11,12,23,24].some(i=>(base[i]?.visibility||0)<.7))&&visible.length>=2){let xs=visible.map(p=>p.x*c.width),ys=visible.map(p=>p.y*c.height),span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),c.height*.12),size=Math.min(Math.max(c.width,c.height),span*2.8),w=Math.min(c.width,size),h=Math.min(c.height,size),x=Math.max(0,Math.min(c.width-w,(Math.min(...xs)+Math.max(...xs)-w)/2)),y=Math.max(0,Math.min(c.height-h,(Math.min(...ys)+Math.max(...ys)-h)/2-span*.35));box={x,y,w,h};let tmp=document.createElement('canvas');tmp.width=Math.round(w);tmp.height=Math.round(h);tmp.getContext('2d').drawImage(frame,x,y,w,h,0,0,tmp.width,tmp.height);status('Running reference-guided crop…');let raw=await infer(tmp);if(raw)crop=raw.map(p=>({...p,x:(x+p.x*w)/c.width,y:(y+p.y*h)/c.height}))}let baseline=evaluate(base),recovery=box?evaluate(crop):null;records.push({clip,requestedSeconds:times[index],seekSeconds:v.currentTime,width:c.width,height:c.height,threshold:.7,baseline,recovery,box,cropGuidedByManualLabels:true});pred=ids.map(i=>base?.[i]||null);draw();let summary=a=>{let errors=a.filter(p=>p.errorPx!==null);return `${errors.length}/${a.filter(p=>p.manual).length} visible reference joints matched; mean error ${errors.length?(errors.reduce((s,p)=>s+p.errorPx,0)/errors.length).toFixed(1)+' px':'N/A'}`};$('result').textContent='Baseline: '+summary(baseline)+(recovery?'\nReference-guided crop: '+summary(recovery):'')+'\nCyan = manual; orange = baseline AI.\nSaved frames: '+records.length;status('Frame saved');$('next').disabled=false}catch(e){status('Analysis failed: '+e.message);active=true;update()}};$('next').onclick=async()=>{try{if(++index<times.length)await loadFrame();else{status('Clip complete. Choose another clip or export.');$('start').disabled=false;$('next').disabled=true}}catch(e){status(e.message);$('start').disabled=false}};$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:7,records},null,2)],{type:'application/json'}));a.href=u;a.download='sprint-v7-validation.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
</script></body></html>
